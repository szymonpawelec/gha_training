name: AWS test

on:
  push:
    branches: [ test/gha ]
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC
  contents: read

jobs:
  aws_test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_DEPLOYER }}
        aws-region: ap-south-2   # match your Terraform/AWS region

    - name: Who am I?
      run: aws sts get-caller-identity

