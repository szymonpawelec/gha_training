name: Sample CI

on:
  push:
    branches: [ test/gha ]
  workflow_dispatch:

jobs:
  hello-world:
    runs-on: ubuntu-latest
    environment:
      name: dit

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Say hello
        run: echo "Hello from GitHub-hosted runner"

      - name: Show files
        run: ls -R

      - name: Use the secret
        env:
          TOKEN: ${{ secrets.TEMPORARY_TOKEN }}
        run: |
          echo "Token length: ${#TOKEN}"  # Prints length, not value
          if [ -n "$TOKEN" ]; then echo "✅ Token is set"; fi